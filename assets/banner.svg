<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 420" width="100%" height="auto">
  <defs>
    <!-- Background Gradients -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#050814" />
      <stop offset="50%" stop-color="#0b132b" />
      <stop offset="100%" stop-color="#070a1e" />
    </linearGradient>

    <!-- Glowing Accent Gradients -->
    <radialGradient id="cyanGlow" cx="20%" cy="30%" r="50%">
      <stop offset="0%" stop-color="#00f2fe" stop-opacity="0.35" />
      <stop offset="100%" stop-color="#00f2fe" stop-opacity="0" />
    </radialGradient>

    <radialGradient id="purpleGlow" cx="80%" cy="40%" r="55%">
      <stop offset="0%" stop-color="#7928ca" stop-opacity="0.4" />
      <stop offset="100%" stop-color="#7928ca" stop-opacity="0" />
    </radialGradient>

    <radialGradient id="blueGlow" cx="50%" cy="85%" r="45%">
      <stop offset="0%" stop-color="#4361ee" stop-opacity="0.25" />
      <stop offset="100%" stop-color="#4361ee" stop-opacity="0" />
    </radialGradient>

    <!-- Title Gradient -->
    <linearGradient id="titleGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="45%" stop-color="#818cf8" />
      <stop offset="85%" stop-color="#c084fc" />
      <stop offset="100%" stop-color="#f472b6" />
    </linearGradient>

    <linearGradient id="badgeGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="rgba(255, 255, 255, 0.12)" />
      <stop offset="100%" stop-color="rgba(255, 255, 255, 0.03)" />
    </linearGradient>

    <linearGradient id="cardGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="rgba(30, 41, 59, 0.7)" />
      <stop offset="100%" stop-color="rgba(15, 23, 42, 0.85)" />
    </linearGradient>

    <!-- Relational Node Gradients -->
    <linearGradient id="nodeGrad1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3b82f6" />
      <stop offset="100%" stop-color="#1d4ed8" />
    </linearGradient>

    <linearGradient id="nodeGrad2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#10b981" />
      <stop offset="100%" stop-color="#047857" />
    </linearGradient>

    <linearGradient id="nodeGrad3" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#8b5cf6" />
      <stop offset="100%" stop-color="#6d28d9" />
    </linearGradient>

    <!-- Drop Shadows -->
    <filter id="shadowFilter" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#000000" flood-opacity="0.65" />
    </filter>

    <filter id="glowEffect" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="5" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

    <!-- Grid Pattern -->
    <pattern id="gridPattern" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="rgba(255, 255, 255, 0.035)" stroke-width="1" />
      <circle cx="40" cy="40" r="1" fill="rgba(56, 189, 248, 0.2)" />
    </pattern>

    <style>
      @keyframes floatSlow {
        0%, 100% { transform: translateY(0px) rotate(0deg); }
        50% { transform: translateY(-8px) rotate(0.5deg); }
      }
      @keyframes floatReverse {
        0%, 100% { transform: translateY(0px) rotate(0deg); }
        50% { transform: translateY(9px) rotate(-0.5deg); }
      }
      @keyframes dashFlow {
        from { stroke-dashoffset: 60; }
        to { stroke-dashoffset: 0; }
      }
      @keyframes pulseGlow {
        0%, 100% { opacity: 0.35; transform: scale(1); }
        50% { opacity: 0.65; transform: scale(1.04); }
      }
      @keyframes subtleBlink {
        0%, 100% { opacity: 0.8; }
        50% { opacity: 0.3; }
      }

      .floating-card-1 {
        animation: floatSlow 7s ease-in-out infinite;
      }
      .floating-card-2 {
        animation: floatReverse 8.5s ease-in-out infinite;
      }
      .glow-pulse {
        animation: pulseGlow 5s ease-in-out infinite;
        transform-origin: center;
      }
      .animated-dash {
        stroke-dasharray: 6 6;
        animation: dashFlow 2.5s linear infinite;
      }
      .signal-dot {
        animation: subtleBlink 2s ease-in-out infinite;
      }
    </style>
  </defs>

  <!-- 1. Background Layers -->
  <rect width="1200" height="420" fill="url(#bgGrad)" rx="16" />
  <rect width="1200" height="420" fill="url(#gridPattern)" rx="16" />

  <!-- Ambient Glow Circles -->
  <circle cx="240" cy="130" r="260" fill="url(#cyanGlow)" class="glow-pulse" />
  <circle cx="960" cy="180" r="280" fill="url(#purpleGlow)" class="glow-pulse" style="animation-delay: -2.5s;" />
  <circle cx="600" cy="350" r="220" fill="url(#blueGlow)" class="glow-pulse" style="animation-delay: -1.2s;" />

  <!-- 2. Background Schematic Relational Lines (strictly in background) -->
  <g opacity="0.38">
    <!-- Connecting Relational Data Lines -->
    <path d="M 120 280 C 220 220, 260 320, 360 270" fill="none" stroke="#38bdf8" stroke-width="2" class="animated-dash" />
    <path d="M 840 260 C 940 320, 980 210, 1080 250" fill="none" stroke="#c084fc" stroke-width="2" class="animated-dash" style="animation-duration: 3.2s;" />
    <path d="M 360 270 C 440 230, 520 250, 600 240" fill="none" stroke="#818cf8" stroke-width="1.5" stroke-dasharray="4 4" />
    <path d="M 600 240 C 680 230, 760 270, 840 260" fill="none" stroke="#818cf8" stroke-width="1.5" stroke-dasharray="4 4" />

    <!-- Foreign Key Connectors -->
    <path d="M 220 90 L 320 90 L 320 150" fill="none" stroke="#0ea5e9" stroke-width="1.5" stroke-dasharray="3 3" />
    <path d="M 880 90 L 980 90 L 980 150" fill="none" stroke="#a855f7" stroke-width="1.5" stroke-dasharray="3 3" />
  </g>

  <!-- 3. Decorative Background Floating Relational Mini-Cards (Far Left & Far Right to never obstruct text) -->
  <!-- Left Side: Relational Table Schema Mini-Preview -->
  <g class="floating-card-1" opacity="0.85">
    <g transform="translate(60, 65)">
      <rect width="180" height="110" rx="10" fill="url(#cardGrad)" stroke="rgba(56, 189, 248, 0.25)" stroke-width="1.5" filter="url(#shadowFilter)" />
      <!-- Table Header -->
      <path d="M 0 10 Q 0 0 10 0 L 170 0 Q 180 0 180 10 L 180 30 L 0 30 Z" fill="rgba(14, 165, 233, 0.2)" />
      <circle cx="16" cy="15" r="4" fill="#38bdf8" />
      <text x="28" y="19" fill="#94a3b8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="600">TABLE users (PK)</text>
      <!-- Rows -->
      <text x="16" y="48" fill="#38bdf8" font-family="'Fira Code', monospace" font-size="9.5">id</text>
      <text x="70" y="48" fill="#64748b" font-family="'Fira Code', monospace" font-size="9">UUID PRIMARY KEY</text>
      <line x1="10" y1="56" x2="170" y2="56" stroke="rgba(255, 255, 255, 0.05)" stroke-width="1" />
      <text x="16" y="72" fill="#e2e8f0" font-family="'Fira Code', monospace" font-size="9.5">tenant_id</text>
      <text x="70" y="72" fill="#64748b" font-family="'Fira Code', monospace" font-size="9">BIGINT INDEXED</text>
      <line x1="10" y1="80" x2="170" y2="80" stroke="rgba(255, 255, 255, 0.05)" stroke-width="1" />
      <text x="16" y="96" fill="#e2e8f0" font-family="'Fira Code', monospace" font-size="9.5">status</text>
      <text x="70" y="96" fill="#10b981" font-family="'Fira Code', monospace" font-size="9">'COMMITTED'</text>
    </g>
  </g>

  <!-- Right Side: ACID & Consensus Metrics Mini-Preview -->
  <g class="floating-card-2" opacity="0.85">
    <g transform="translate(960, 65)">
      <rect width="180" height="110" rx="10" fill="url(#cardGrad)" stroke="rgba(192, 132, 252, 0.25)" stroke-width="1.5" filter="url(#shadowFilter)" />
      <!-- Table Header -->
      <path d="M 0 10 Q 0 0 10 0 L 170 0 Q 180 0 180 10 L 180 30 L 0 30 Z" fill="rgba(168, 85, 247, 0.2)" />
      <circle cx="16" cy="15" r="4" fill="#c084fc" />
      <text x="28" y="19" fill="#cbd5e1" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="600">ACID GUARANTEES</text>
      <!-- Rows -->
      <text x="16" y="48" fill="#a78bfa" font-family="'Fira Code', monospace" font-size="9.5">Isolation</text>
      <text x="80" y="48" fill="#10b981" font-family="'Fira Code', monospace" font-size="9">SERIALIZABLE</text>
      <line x1="10" y1="56" x2="170" y2="56" stroke="rgba(255, 255, 255, 0.05)" stroke-width="1" />
      <text x="16" y="72" fill="#a78bfa" font-family="'Fira Code', monospace" font-size="9.5">Consensus</text>
      <text x="80" y="72" fill="#38bdf8" font-family="'Fira Code', monospace" font-size="9">RAFT / 2PC</text>
      <line x1="10" y1="80" x2="170" y2="80" stroke="rgba(255, 255, 255, 0.05)" stroke-width="1" />
      <text x="16" y="96" fill="#a78bfa" font-family="'Fira Code', monospace" font-size="9.5">Durability</text>
      <text x="80" y="96" fill="#f59e0b" font-family="'Fira Code', monospace" font-size="9">WAL SYNC'D</text>
    </g>
  </g>

  <!-- 4. Foreground Content (Centered, clear, prominent, unobstructed) -->
  <g transform="translate(600, 155)" text-anchor="middle">
    <!-- Top Pill Category Badge -->
    <g transform="translate(0, -68)">
      <rect x="-165" y="-14" width="330" height="28" rx="14" fill="url(#badgeGrad)" stroke="rgba(56, 189, 248, 0.35)" stroke-width="1.2" />
      <circle cx="-140" cy="0" r="4.5" fill="#10b981" class="signal-dot" />
      <text x="8" y="4" fill="#e0f2fe" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="700" letter-spacing="1.2">CURATED ECOSYSTEM DIRECTORY</text>
    </g>

    <!-- Main Title -->
    <text x="0" y="24" fill="url(#titleGrad)" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="44" font-weight="900" letter-spacing="-0.5" filter="url(#shadowFilter)">
      Awesome Relational Databases
    </text>

    <!-- Subtitle Description -->
    <text x="0" y="66" fill="#94a3b8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="16.5" font-weight="400" letter-spacing="0.2">
      Enterprise Cloud DBaaS · Distributed SQL · Open-Source RDBMS · ACID Engines
    </text>

    <!-- Interactive / Feature Highlights Pills -->
    <g transform="translate(0, 115)">
      <!-- Pill 1: ACID -->
      <g transform="translate(-360, 0)">
        <rect x="-70" y="-15" width="140" height="30" rx="15" fill="rgba(15, 23, 42, 0.85)" stroke="rgba(56, 189, 248, 0.3)" stroke-width="1.2" />
        <text x="0" y="4" fill="#7dd3fc" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="600">⚡ ACID Compliant</text>
      </g>

      <!-- Pill 2: Distributed SQL -->
      <g transform="translate(-180, 0)">
        <rect x="-75" y="-15" width="150" height="30" rx="15" fill="rgba(15, 23, 42, 0.85)" stroke="rgba(129, 140, 248, 0.3)" stroke-width="1.2" />
        <text x="0" y="4" fill="#a5b4fc" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="600">🌐 Distributed SQL</text>
      </g>

      <!-- Pill 3: PostgreSQL & MySQL -->
      <g transform="translate(0, 0)">
        <rect x="-75" y="-15" width="150" height="30" rx="15" fill="rgba(15, 23, 42, 0.85)" stroke="rgba(192, 132, 252, 0.3)" stroke-width="1.2" />
        <text x="0" y="4" fill="#d8b4fe" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="600">🐘 Postgres &amp; MySQL</text>
      </g>

      <!-- Pill 4: Scale-Out HTAP -->
      <g transform="translate(180, 0)">
        <rect x="-70" y="-15" width="140" height="30" rx="15" fill="rgba(15, 23, 42, 0.85)" stroke="rgba(52, 211, 153, 0.3)" stroke-width="1.2" />
        <text x="0" y="4" fill="#6ee7b7" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="600">🚀 Scale-Out HTAP</text>
      </g>

      <!-- Pill 5: Cloud Native -->
      <g transform="translate(360, 0)">
        <rect x="-70" y="-15" width="140" height="30" rx="15" fill="rgba(15, 23, 42, 0.85)" stroke="rgba(244, 114, 182, 0.3)" stroke-width="1.2" />
        <text x="0" y="4" fill="#f472b6" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="600">☁️ Cloud Native DB</text>
      </g>
    </g>
  </g>

  <!-- Subtle Bottom Border Lighting -->
  <line x1="120" y1="419" x2="1080" y2="419" stroke="url(#titleGrad)" stroke-width="1.5" opacity="0.6" />
</svg>
